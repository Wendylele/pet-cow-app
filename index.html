<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宠物奶牛">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<title>宠物奶牛·学习乐园</title>
<style>
:root{
--pink:#FF8FAB;--pink-l:#FFC5D9;--pink-d:#E57393;--pink-dd:#C24D6E;
--lav:#C8A9FC;--lav-l:#E8DFFB;--lav-d:#9B6FE0;
--blue:#E8F4FD;--blue-d:#2C5F8E;--blue-c:#3A7BB5;
--sun:#FFD93D;--sun-d:#FFC93C;
--green:#6BCB77;--green-d:#4FA85E;
--red:#FF6B6B;--red-d:#E84A5F;
--orange:#FF9F40;
--t1:#5A3D6A;--t2:#7B5D8A;--t3:#A99BC0;
--w:#FFF;--bg:#FFF0F5;--bg2:#FFE4EC;
--sh:0 4px 16px rgba(255,143,171,.15);
--r:18px;--rs:12px;--nav-w:220px;--nav-w2:180px;--hh:56px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);line-height:1.6;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none;transition:all .15s}
button:active{transform:scale(.97)}
ul{list-style:none}
a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh;min-height:-webkit-fill-available}
/* 左侧导航 */
.nav{width:var(--nav-w);background:linear-gradient(180deg,var(--pink),var(--pink-d));position:fixed;top:0;left:0;bottom:0;z-index:100;box-shadow:2px 0 16px rgba(255,143,171,.2);overflow-y:auto;display:flex;flex-direction:column}
.nav-head{padding:18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.2)}
.logo{width:42px;height:42px;background:rgba(255,255,255,.22);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex-shrink:0}
.brand{display:flex;flex-direction:column}
.brand-t{color:#fff;font-size:14px;font-weight:700}
.brand-s{color:var(--pink-l);font-size:11px}
.nav-menu{flex:1;padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--rs);color:#fff;font-size:14px;margin-bottom:3px;cursor:pointer;transition:all .2s}
.nav-item:hover{background:rgba(255,255,255,.1)}
.nav-item.on{background:var(--lav-l);color:var(--pink-dd);font-weight:600}
.nav-ico{width:30px;height:30px;background:rgba(255,255,255,.16);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.nav-item.on .nav-ico{background:rgba(255,255,255,.4)}
.nav-foot{padding:12px;border-top:1px solid rgba(255,255,255,.2)}
.pet-mini{background:rgba(255,255,255,.16);border-radius:var(--rs);padding:10px 12px;display:flex;align-items:center;gap:8px}
.pet-emoji{font-size:28px}
.pet-info{flex:1}
.pet-name{color:#fff;font-size:13px;font-weight:600}
.pet-bar{height:6px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:4px}
.pet-bar-fill{height:100%;background:var(--sun);border-radius:3px;transition:width .3s}
/* 主内容 */
.main{flex:1;margin-left:var(--nav-w);min-height:100vh;display:flex;flex-direction:column}
.content{flex:1;padding:20px;max-width:1100px;width:100%}
/* 手机顶栏 */
.mob-head{display:none;position:fixed;top:0;left:0;right:0;height:var(--hh);background:linear-gradient(90deg,var(--pink),var(--pink-d));align-items:center;justify-content:space-between;padding:0 12px;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ham{width:38px;height:38px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.mob-brand{display:flex;align-items:center;gap:6px}
.mob-brand .logo{width:34px;height:34px;font-size:12px}
.mob-brand .brand-t{font-size:13px;color:#fff}
.mob-pts{color:var(--sun);font-weight:700;font-size:14px;display:flex;align-items:center;gap:2px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.overlay.show{display:block}
/* 页面 */
.page{display:none}.page.on{display:block;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pg-hd{margin-bottom:16px}
.pg-t{font-size:clamp(18px,3vw,24px);font-weight:800;display:flex;align-items:center;gap:6px}
.pg-s{color:var(--t2);font-size:13px;margin-top:3px}
.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.card-t{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.sc{border-radius:var(--r);padding:16px 14px;color:#fff;position:relative}
.sc .sv{font-size:26px;font-weight:800;line-height:1.2}
.sc .sl{font-size:12px;opacity:.9;margin-top:2px}
.sc-pk{background:linear-gradient(135deg,var(--pink-l),var(--pink))}
.sc-lv{background:linear-gradient(135deg,var(--lav-l),var(--lav))}
.sc-bl{background:linear-gradient(135deg,var(--blue-c),var(--blue-d))}
.sc-gn{background:linear-gradient(135deg,#7DD886,var(--green-d))}
.sc-sun{background:linear-gradient(135deg,#FFE564,var(--sun-d));color:#7a5a00}
.sc-or{background:linear-gradient(135deg,#FFB347,var(--orange))}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
/* 进度条 */
.pbar{background:var(--pink-l);border-radius:16px;height:8px;overflow:hidden;margin:6px 0}
.pfill{height:100%;background:linear-gradient(90deg,var(--green),#8AE093);border-radius:16px;transition:width .4s}
/* 欢迎横幅 */
.wban{background:linear-gradient(135deg,var(--pink),var(--pink-d));border-radius:var(--r);padding:20px;color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:14px}
.wban h2{font-size:clamp(16px,2.5vw,22px);font-weight:800;margin-bottom:4px}
.wban p{color:var(--pink-l);font-size:13px}
.wpts{background:rgba(255,255,255,.18);border-radius:14px;padding:14px 18px;text-align:center;min-width:120px}
.wpts .n{font-size:28px;font-weight:800;color:var(--sun);display:flex;align-items:center;gap:4px;justify-content:center}
.wpts .l{font-size:11px;color:var(--pink-l);margin-top:2px}
/* 任务卡 */
.tk{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px;display:flex;align-items:center;gap:12px;border-left:4px solid var(--pink)}
.tk.done{border-left-color:var(--green);background:linear-gradient(90deg,#F0FBF1,#fff 60%)}
.tk-i{flex:1;min-width:0}
.tk-n{font-weight:600;font-size:14px;color:var(--t1)}
.tk-m{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.tk-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--blue);color:var(--blue-d)}
.tk-pts{font-size:12px;color:#C88A00;font-weight:600;display:flex;align-items:center;gap:2px}
.btk{padding:7px 16px;border-radius:18px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.btk-pk{background:var(--pink);color:#fff}.btk-pk:hover{background:var(--pink-d)}
.btk-gn{background:var(--green);color:#fff}
.btk-gy{background:#D5CBE8;color:#999;cursor:not-allowed}
.btk-lv{background:var(--lav);color:#fff}.btk-lv:hover{background:var(--lav-d)}
.btk-or{background:var(--orange);color:#fff}
/* 课本标签 */
.tb{font-size:11px;padding:2px 8px;border-radius:8px;display:inline-block;margin-bottom:4px}
.tb-s3{background:#FFE0B2;color:#E65100}
.tb-math{background:#E8F4FD;color:#2C5F8E}
.tb-eng{background:#C8E6C9;color:#2E7D32}
/* 古诗 */
.poem-c{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);border-top:4px solid var(--lav);cursor:pointer;transition:all .2s}
.poem-c:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,143,171,.2)}
.poem-t{font-size:16px;font-weight:700;color:var(--t1)}
.poem-a{font-size:12px;color:var(--t2);margin:2px 0 8px}
.poem-pr{font-size:13px;color:var(--t2);line-height:1.8}
.poem-st{margin-top:10px;font-size:12px;display:inline-block;padding:2px 10px;border-radius:10px}
.poem-st.m{background:#E8F8EA;color:var(--green-d)}
.poem-st.t{background:var(--blue);color:var(--blue-d)}
.poem-tag{background:#E8F8EA;border:1px solid var(--green);color:var(--green-d);font-size:13px;font-weight:600;padding:6px 14px;border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:transform .15s}
.poem-tag:hover{transform:scale(1.05)}
.poem-line{font-size:18px;line-height:2.2;color:var(--t1);text-align:center}
.sq{display:inline-block;position:relative;cursor:pointer;border-bottom:2px dotted var(--pink-d);color:var(--pink-dd);margin:0 1px;transition:all .15s}
.sq:hover{background:var(--pink-l);border-radius:4px}
.sq .py-tip{display:none;position:absolute;bottom:140%;left:50%;transform:translateX(-50%);background:var(--pink-d);color:#fff;font-size:13px;padding:3px 10px;border-radius:10px;white-space:nowrap;z-index:10;font-weight:600}
.sq .py-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--pink-d)}
.sq.show .py-tip{display:block;animation:pyPop .2s ease}
@keyframes pyPop{0%{transform:translateX(-50%) scale(0);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.def{color:var(--lav-d);font-size:12px;background:var(--lav-l);padding:2px 8px;border-radius:6px;display:inline-block;margin:2px}
/* 数学预习 */
.math-lesson{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:10px}
.math-lesson.on{border:2px solid var(--green);background:linear-gradient(90deg,#F0FBF1,#fff 60%)}
.ml-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ml-t{font-weight:700;font-size:15px}
.ml-sub{font-size:13px;color:var(--t2);margin-bottom:10px}
.ml-quiz{background:var(--bg);border-radius:var(--rs);padding:12px;margin:8px 0}
.ml-q{font-size:14px;margin-bottom:6px;font-weight:600}
.ml-opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.ml-opt{padding:6px 14px;border-radius:14px;background:#fff;font-size:13px;border:2px solid transparent;cursor:pointer}
.ml-opt.ok{background:var(--green);color:#fff;border-color:var(--green)}
.ml-opt.no{background:var(--red);color:#fff;border-color:var(--red)}
.ml-opt:active{transform:scale(.95)}
.ml-result{font-size:13px;margin-top:6px;padding:6px;border-radius:var(--rs)}
.ml-result.ok{background:#E8F8EA;color:var(--green-d)}
.ml-result.no{background:#FFE4EC;color:var(--pink-d)}
/* 英语单词 */
.eng-unit{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:10px}
.word-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg2)}
.word-item:last-child{border-bottom:none}
.word-w{font-weight:600;font-size:14px}
.word-p{font-size:12px;color:var(--t2)}
.word-m{font-size:12px;color:var(--pink-d)}
.word-st{font-size:11px;padding:1px 6px;border-radius:6px;flex-shrink:0}
.word-st.done{background:#E8F8EA;color:var(--green-d)}
.word-st.todo{background:var(--bg2);color:var(--t2)}
/* 游戏 */
.game-area{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px;text-align:center}
.game-title{font-size:20px;font-weight:800;color:var(--pink-d);margin-bottom:10px}
.game-q{font-size:18px;font-weight:600;margin:12px 0}
.game-opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.game-opt{padding:12px 24px;border-radius:20px;background:var(--bg2);font-size:15px;cursor:pointer;border:3px solid transparent}
.game-opt.sel{border-color:var(--pink)}
.game-opt.ok{background:var(--green);color:#fff;border-color:var(--green)}
.game-opt.no{background:var(--red);color:#fff;border-color:var(--red)}
/* 英语填空键盘 */
.fill-cell{display:inline-block;width:30px;height:36px;line-height:36px;text-align:center;font-size:22px;font-weight:800;color:var(--lav-d);border-bottom:3px solid var(--lav);margin:0 3px;font-family:monospace;cursor:pointer}
.fill-cell.filled{color:var(--pink-d);border-bottom-color:var(--pink)}
.fill-cell.cursor{border-bottom-color:var(--pink-d);background:var(--pink-l)}
.eng-keyboard{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:12px 0}
.kb-key{width:32px;height:36px;border-radius:8px;background:var(--lav-l);color:var(--lav-d);font-size:15px;font-weight:700;border:1px solid var(--lav);cursor:pointer;transition:all .1s}
.kb-key:hover{background:var(--lav);color:#fff}
.kb-key:active{transform:scale(.92)}
.game-score{font-size:16px;font-weight:700;color:var(--pink-d);margin:10px 0}
/* 宠物 */
.pet-area{background:linear-gradient(135deg,#FFF5D6,#FFEFB0);border-radius:var(--r);padding:20px;text-align:center;box-shadow:var(--sh)}
.pet-big{font-size:80px;margin:10px 0;cursor:pointer;transition:transform .2s}
.pet-big:hover{transform:scale(1.05)}
/* 宠物动画 */
.pet-bounce{animation:petBounce .4s ease 3}
.pet-wiggle{animation:petWiggle .3s ease 4}
.pet-run{animation:petRun .5s ease 3}
.pet-jump{animation:petJump .35s ease 4}
.pet-shake{animation:petShake .3s ease 4}
.pet-sleep{animation:petSleep 1.5s ease 2}
@keyframes petBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes petWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes petRun{0%{transform:translateX(0)}25%{transform:translateX(-20px)}75%{transform:translateX(20px)}100%{transform:translateX(0)}}
@keyframes petJump{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.15) translateY(-20px)}}
@keyframes petShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-15deg)}40%{transform:rotate(15deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}}
@keyframes petSleep{0%,100%{transform:scale(1)}50%{transform:scale(.85);opacity:.7}}
/* 语音气泡 */
.pet-bubble-wrap{text-align:center;margin-bottom:4px}
.pet-bubble{display:inline-block;background:var(--pink);color:#fff;font-size:14px;font-weight:600;padding:8px 16px;border-radius:16px 16px 16px 4px;animation:bubblePop .3s ease;position:relative;max-width:260px}
.pet-bubble::after{content:'';position:absolute;bottom:-6px;left:20px;width:12px;height:12px;background:var(--pink);border-radius:0 0 12px 0;transform:rotate(20deg)}
@keyframes bubblePop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes remindSlide{0%{transform:translateX(-50%) translateY(-30px);opacity:0}100%{transform:translateX(-50%) translateY(0);opacity:1}}
.pet-stats{display:flex;gap:12px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.ps-item{background:rgba(255,255,255,.6);border-radius:var(--rs);padding:8px 12px;text-align:center;min-width:80px}
.ps-l{font-size:11px;color:var(--t2)}
.ps-v{font-size:18px;font-weight:700}
.ps-bar{height:6px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:4px}
.ps-fill{height:100%;border-radius:3px;transition:width .3s}
.ps-fill.hp{background:var(--pink)}
.ps-fill.full{background:var(--green)}
.ps-fill.happy{background:var(--sun)}
.ps-fill.clean{background:var(--blue-c)}
.pet-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pa-btn{padding:8px 16px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.pa-btn.pk{background:var(--pink);color:#fff}
.pa-btn.gn{background:var(--green);color:#fff}
.pa-btn.lv{background:var(--lav);color:#fff}
.pa-btn.sun{background:var(--sun-d);color:#7a5a00}
.pa-btn.bl{background:var(--blue-c);color:#fff}
.pa-btn.or{background:var(--orange);color:#fff}
/* 商城 */
.shop-item{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);text-align:center}
.shop-emoji{font-size:36px;margin-bottom:6px}
.shop-n{font-weight:600;font-size:14px}
.shop-d{font-size:12px;color:var(--t2);margin-bottom:6px}
.shop-p{color:#C88A00;font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:2px}
/* 错题本 */
.err-item{background:var(--bg2);border-radius:var(--rs);padding:12px;margin-bottom:8px}
.err-q{font-size:14px;font-weight:600;color:var(--pink-d)}
.err-a{font-size:13px;color:var(--green-d);margin-top:4px}
.err-date{font-size:11px;color:var(--t2)}
/* 预习内容 */
.learn-box{background:linear-gradient(135deg,#FFF8F0,#FFEEF5);border-radius:var(--r);padding:14px;margin-bottom:12px;cursor:pointer;border:2px dashed var(--pink-l)}
.learn-header{font-size:14px;font-weight:600;color:var(--pink-d);text-align:center}
.learn-content{display:none;text-align:left;font-size:13px;color:var(--t1);line-height:1.7;padding-top:10px;border-top:1px dashed var(--pink-l);margin-top:8px}
.learn-content.open{display:block}
.learn-content b{color:var(--pink-d)}
.learn-content br+br{margin-top:4px}
/* 弹窗 */
.mm{display:none;position:fixed;inset:0;background:rgba(90,60,110,.45);z-index:200;align-items:center;justify-content:center;padding:16px}
.mm.show{display:flex}
.mc{background:#fff;border-radius:var(--r);max-width:460px;width:100%;max-height:85vh;overflow-y:auto;padding:22px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.mt{font-size:18px;font-weight:800;text-align:center;color:var(--pink-d);margin-bottom:4px}
.ms{text-align:center;color:var(--t2);font-size:13px;margin-bottom:14px}
.mf{margin-top:16px;display:flex;gap:8px}
.bpr{flex:1;padding:10px;border-radius:12px;background:var(--pink);color:#fff;font-size:14px;font-weight:600}
.bpr:hover{background:var(--pink-d)}
.bse{flex:1;padding:10px;border-radius:12px;background:var(--bg2);color:var(--t2);font-size:14px}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--t1);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:all .25s;max-width:90vw;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{background:var(--green-d)}
.toast.no{background:var(--pink-d)}
/* 打卡 */
.ck-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg2)}
.ck-item:last-child{border-bottom:none}
.ck-box{width:20px;height:20px;border:2px solid var(--pink);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#fff;transition:all .2s}
.ck-box.done{background:var(--green);border-color:var(--green)}
.ck-txt{font-size:14px;flex:1}
.ck-txt.done{color:var(--t3);text-decoration:line-through}
.ck-pts{font-size:12px;color:#C88A00;font-weight:600}
.ck-del{font-size:11px;color:var(--red);cursor:pointer;padding:4px 8px;border-radius:6px;background:var(--bg2)}

<script>

const POEMS=[
{id:'p1',t:'山行',a:'杜牧',b:'三上',l:['远上寒山石径斜','白云生处有人家','停车坐爱枫林晚','霜叶红于二月花'],def:[{'寒山':'深秋时节的山','石径斜':'山路倾斜向上','霜叶':'经霜的枫叶'}],py:{'斜':'xié','径':'jìng','霜':'shuāng','枫':'fēng'},r:5},
{id:'p2',t:'赠刘景文',a:'苏轼',b:'三上',l:['荷尽已无擎雨盖','菊残犹有傲霜枝','一年好景君须记','最是橙黄橘绿时'],def:[{'擎雨盖':'托着雨伞似的荷叶','傲霜枝':'不怕霜打的菊枝','橙黄橘绿':'秋末初冬的美景'}],py:{'擎':'qíng','菊':'jú','残':'cán','傲':'ào','橙':'chéng','橘':'jú'},r:5},
{id:'p3',t:'夜书所见',a:'叶绍翁',b:'三上',l:['萧萧梧叶送寒声','江上秋风动客情','知有儿童挑促织','夜深篱落一灯明'],def:[{'萧萧':'风声','促织':'蟋蟀','篱落':'篱笆'}],py:{'萧':'xiāo','梧':'wú','挑':'tiǎo','促':'cù','篱':'lí'},r:5},
{id:'p4',t:'望天门山',a:'李白',b:'三上',l:['天门中断楚江开','碧水东流至此回','两岸青山相对出','孤帆一片日边来'],def:[{'楚江':'长江','至此回':'在这里转弯','孤帆':'一只小船'}],py:{'断':'duàn','楚':'chǔ','碧':'bì','帆':'fān'},r:5},
{id:'p5',t:'望洞庭',a:'刘禹锡',b:'三上',l:['湖光秋月两相和','潭面无风镜未磨','遥望洞庭山水翠','白银盘里一青螺'],def:[{'两相和':'相互交融','镜未磨':'水面平静如未打磨的铜镜','青螺':'洞庭湖中的君山'}],py:{'和':'hé','潭':'tán','磨':'mó','遥':'yáo','庭':'tíng','螺':'luó'},r:5},
{id:'p6',t:'早发白帝城',a:'李白',b:'三上',l:['朝辞白帝彩云间','千里江陵一日还','两岸猿声啼不住','轻舟已过万重山'],def:[{'朝辞':'早晨离开','一日还':'一天就到了','万重山':'重重叠叠的山峦'}],py:{'朝':'zhāo','辞':'cí','陵':'líng','还':'huán','猿':'yuán','啼':'tí'},r:5},
{id:'p7',t:'饮湖上初晴后雨',a:'苏轼',b:'三上',l:['水光潋滟晴方好','山色空蒙雨亦奇','欲把西湖比西子','淡妆浓抹总相宜'],def:[{'潋滟':'水波荡漾闪烁的样子','空蒙':'云雾迷茫','西子':'西施，美女','淡妆浓抹':'无论淡雅还是浓艳'}],py:{'潋':'liàn','滟':'yàn','蒙':'méng','亦':'yì','宜':'yí'},r:5},
{id:'p8',t:'采莲曲',a:'王昌龄',b:'三上',l:['荷叶罗裙一色裁','芙蓉向脸两边开','乱入池中看不见','闻歌始觉有人来'],def:[{'罗裙':'丝绸裙子','芙蓉':'荷花','乱入':'混入莲池中','闻歌':'听到歌声'}],py:{'裙':'qún','裁':'cái','芙':'fú','蓉':'róng','乱':'luàn','觉':'jué'},r:5},
{id:'p9',t:'鹿柴',a:'王维',b:'三上',l:['空山不见人','但闻人语响','返景入深林','复照青苔上'],def:[{'鹿柴':'养鹿的栅栏，柴通寨','但闻':'只听到','返景':'夕阳返照','青苔':'绿色的苔藓'}],py:{'柴':'zhài','闻':'wén','返':'fǎn','景':'yǐng','苔':'tái'},r:5},
{id:'p10',t:'所见',a:'袁枚',b:'三上',l:['牧童骑黄牛','歌声振林樾','意欲捕鸣蝉','忽然闭口立'],def:[{'振林樾':'歌声震动了树林','意欲':'想要','鸣蝉':'叫着的蝉','闭口立':'突然闭嘴站立'}],py:{'牧':'mù','振':'zhèn','樾':'yuè','欲':'yù','捕':'bǔ','蝉':'chán'},r:5}
]

const MATH_COURSE=[
{id:'m1',t:'两步四则运算与应用题',sub:[
{id:'m1-1',t:'两步四则运算',tip:'先乘除后加减，有括号先算括号',learn:'<b>运算规则：</b><br>① 在没有括号的算式里，先算乘除，再算加减。<br>② 有括号的算式，先算括号里面的。<br><br><b>例题：</b><br>3 + 4 × 2 = ？<br>→ 先算乘法：4 × 2 = 8<br>→ 再算加法：3 + 8 = <b>11</b><br><br>(3 + 4) × 2 = ？<br>→ 先算括号：3 + 4 = 7<br>→ 再算乘法：7 × 2 = <b>14</b><br><br>⚠️ <b>注意：</b>运算顺序不同，结果可能不同！'},
{id:'m1-2',t:'应用题',tip:'读懂题意，找出数量关系，列式计算',learn:'<b>解题步骤：</b><br>① 读题：仔细读2遍，圈出数字和关键词<br>② 找关系：加→合在一起，减→去掉/相差，乘→几个几，除→平均分<br>③ 列式：根据关系写出算式<br>④ 检验：把答案代回题目看是否合理<br><br><b>例题：</b><br>小明有8颗糖，小红比小明多5颗，他们一共有多少颗？<br>→ 小红：8 + 5 = 13颗<br>→ 一共：8 + 13 = <b>21颗</b>'}
]},
{id:'m2',t:'用一位数乘',sub:[
{id:'m2-1',t:'一位数乘整十数、整百数',tip:'先乘0前面的数，再添0',learn:'<b>方法：</b>先把0前面的数相乘，再看末尾有几个0就添几个0。<br><br><b>例题：</b><br>3 × 40 = ？<br>→ 3 × 4 = 12 → 添1个0 → <b>120</b><br><br>5 × 200 = ？<br>→ 5 × 2 = 10 → 添2个0 → <b>1000</b><br><br>⚠️ <b>易错点：</b>3 × 40 ≠ 30 × 40！前面只有1个0。'},
{id:'m2-2',t:'一位数乘两位数',tip:'从个位起逐位相乘',learn:'<b>方法：</b>从个位起，用一位数依次乘两位数的每一位，满几十就向前一位进几。<br><br><b>例题：</b> 23 × 4 = ？<br>→ 3 × 4 = 12 → 写2进1<br>→ 2 × 4 = 8 → 8 + 1 = 9<br>→ 结果：<b>92</b><br><br>⚠️ <b>进位别忘了！</b> 46 × 3：<br>→ 6×3=18(写8进1) → 4×3=12 → 12+1=13 → <b>138</b>'},
{id:'m2-3',t:'一位数乘三位数',tip:'注意进位，逐位相乘',learn:'<b>方法：</b>同两位数乘法，从个位起逐位乘，注意连续进位。<br><br><b>例题：</b> 125 × 3 = ？<br>→ 5×3=15 → 写5进1<br>→ 2×3=6 → 6+1=7 → 写7<br>→ 1×3=3 → 写3<br>→ 结果：<b>375</b><br><br>⚠️ <b>连续进位：</b> 486 × 5<br>→ 6×5=30(写0进3) → 8×5=40 → 40+3=43(写3进4) → 4×5=20 → 20+4=24 → <b>2430</b>'},
{id:'m2-4',t:'估算',tip:'先近似到整十整百再计算',learn:'<b>方法：</b>把数近似到最近的整十或整百数，再计算，得出大约的结果。<br><br><b>例题：</b><br>48 × 3 ≈ ？<br>→ 48 近似为 50<br>→ 50 × 3 = <b>150</b>（大约）<br>→ 实际：48 × 3 = 144<br><br>⚠️ <b>估算用途：</b>检查计算结果是否合理。如果你算出48×3=544，估算≈150告诉你结果不对！'}
]},
{id:'m3',t:'三角形与四边形',sub:[
{id:'m3-1',t:'角的初步认识',tip:'角有顶点和两条边，角的大小与边长短无关',learn:'<b>角的知识：</b><br>① 角由一个<b>顶点</b>和两条<b>边</b>组成<br>② 角的大小看两条边<b>张开程度</b>，与边的长短<b>无关</b><br>③ 角的分类：<br>　<b>锐角</b>：比直角小（张开窄）<br>　<b>直角</b>：刚好90°（像L形）<br>　<b>钝角</b>：比直角大（张开宽）<br><br>⚠️ <b>易错：</b>边画得长长的角不一定大！角的大小只看张开程度。'},
{id:'m3-2',t:'三角形与四边形的初步认识',tip:'三角形三条边三个角，四边形四条边四个角',learn:'<b>三角形：</b><br>① 有<b>3条边</b>和<b>3个角</b><br>② 三条边首尾相连围成封闭图形<br>③ 按角分类：锐角三角形、直角三角形、钝角三角形<br><br><b>四边形：</b><br>① 有<b>4条边</b>和<b>4个角</b><br>② 特殊四边形：<br>　<b>长方形</b>：对边相等，4个直角<br>　<b>正方形</b>：4条边相等，4个直角<br>　<b>平行四边形</b>：对边平行且相等<br><br>⚠️ <b>记住：</b>三角形最少需要3条线段，四边形最少需要4条线段才能围成。'}
]},
{id:'m4',t:'用一位数除',sub:[
{id:'m4-1',t:'一位数除整十数、整百数',tip:'先用0前面的数除，再添0',learn:'<b>方法：</b>先把末尾的0去掉，用0前面的数除，再看去掉几个0就补几个0。<br><br><b>例题：</b><br>60 ÷ 3 = ？<br>→ 6 ÷ 3 = 2 → 补1个0 → <b>20</b><br><br>400 ÷ 2 = ？<br>→ 4 ÷ 2 = 2 → 补2个0 → <b>200</b><br><br>⚠️ <b>注意：</b>80 ÷ 4 → 8÷4=2 → 补1个0 → 20，不是200！'},
{id:'m4-2',t:'一位数除两位数',tip:'从高位起逐位除',learn:'<b>方法：</b>从高位（十位）起除，除到哪位商写在哪位上面，余数要比除数小。<br><br><b>例题：</b> 48 ÷ 3 = ？<br>→ 4÷3=1余1 → 十位商1<br>→ 余下的1和8合成18 → 18÷3=6 → 个位商6<br>→ 结果：<b>16</b><br><br>⚠️ <b>余数规则：</b>每次除完余数必须<b>比除数小</b>！<br>如 53 ÷ 4 → 十位5÷4=1余1 → 13÷4=3余1 → <b>13余1</b>'},
{id:'m4-3',t:'倍',tip:'求倍数用乘法，求一倍量用除法',learn:'<b>倍的概念：</b><br>① "A是B的几倍" → 用<b>除法</b>：A ÷ B<br>② "A的3倍是多少" → 用<b>乘法</b>：A × 3<br>③ "A比B多几倍" → (A - B) ÷ B<br><br><b>例题：</b><br>小明有6颗糖，小红有18颗，小红是小明的几倍？<br>→ 18 ÷ 6 = <b>3倍</b><br><br>小明有6颗糖，他的3倍是多少？<br>→ 6 × 3 = <b>18颗</b><br><br>⚠️ <b>分清：</b>"求几倍"用÷，"求几倍是多少"用×'},
{id:'m4-4',t:'一位数除三位数',tip:'注意余数要比除数小',learn:'<b>方法：</b>同两位数除法，从百位起依次除，每步余数都要比除数小。<br><br><b>例题：</b> 156 ÷ 4 = ？<br>→ 1÷4不够商 → 看前两位15<br>→ 15÷4=3余3 → 百位十位商3<br>→ 余3和6合成36 → 36÷4=9 → 个位商9<br>→ 结果：<b>39</b><br><br>⚠️ <b>首位不够除：</b>看前两位！如156÷4，百位1不够除4，要看15÷4。'},
{id:'m4-5',t:'除法的应用',tip:'平均分、包含除等问题',learn:'<b>两种除法类型：</b><br>① <b>平均分</b>：把总数平均分成几份，每份多少？<br>　例：12颗糖分给3人，每人几颗？→ 12÷3=<b>4颗</b><br><br>② <b>包含除</b>：总数里包含几个每份的数量？<br>　例：12颗糖每4颗一包，能分几包？→ 12÷4=<b>3包</b><br><br>⚠️ <b>审题关键：</b>看清是"每份多少"还是"能分多少份"，列式可能相同但含义不同！'},
{id:'m4-6',t:'单价、数量、总价',tip:'总价=单价×数量',learn:'<b>三个量之间的关系：</b><br>① <b>总价</b> = 单价 × 数量<br>② <b>单价</b> = 总价 ÷ 数量<br>③ <b>数量</b> = 总价 ÷ 单价<br><br><b>例题：</b><br>铅笔每支3元，买了5支，总价多少？→ 3×5=<b>15元</b><br><br>花15元买了5支铅笔，每支多少？→ 15÷5=<b>3元</b><br><br>铅笔3元一支，15元能买几支？→ 15÷3=<b>5支</b><br><br>⚠️ <b>口诀：</b>知道两个量就能求第三个量，乘除互逆！'}
]},
{id:'m5',t:'年、月、日的秘密',sub:[
{id:'m5-1',t:'制作作息时间表',tip:'1时=60分，1分=60秒',learn:'<b>时间单位换算：</b><br>① <b>1时 = 60分</b><br>② <b>1分 = 60秒</b><br>③ 1时 = 3600秒<br><br><b>计算经过时间：</b><br>→ 结束时间 - 开始时间 = 经过时间<br>→ 例：8:30到9:15，经过了？<br>　 9:15 - 8:30 → 60-30=30分 → <b>45分钟</b><br><br><b>作息时间表：</b>合理安排每天的学习、休息、运动时间。<br><br>⚠️ <b>易错：</b>8:50到9:20不是70分钟！→ 10+20=30分钟。'},
{id:'m5-2',t:'制作月历牌',tip:'大月31天小月30天，二月28或29天',learn:'<b>月份天数：</b><br>① <b>大月</b>（31天）：1、3、5、7、8、10、12月<br>② <b>小月</b>（30天）：4、6、9、11月<br>③ <b>二月</b>：平年28天，闰年29天<br><br><b>记忆口诀：</b><br>"一三五七八十腊，三十一天永不差"<br>（腊=12月）<br><br><b>闰年判断：</b><br>→ 年份÷4，能整除是闰年<br>→ 但整百年需÷400才闰<br>　例：2024÷4=506 → <b>闰年</b><br>　1900÷400≠5 → <b>不是闰年</b>'}
]},
{id:'m6',t:'周长',sub:[
{id:'m6-1',t:'长度的测量',tip:'毫米、厘米、分米、米的关系',learn:'<b>长度单位换算：</b><br>① 1米 = 10分米 = 100厘米 = 1000毫米<br>② 1分米 = 10厘米<br>③ 1厘米 = 10毫米<br><br><b>测量方法：</b><br>→ 尺的0刻度对齐物体一端<br>→ 读另一端对应的刻度<br>→ 看清楚单位（cm/mm）<br><br><b>估测参考：</b><br>→ 1厘米 ≈ 指甲盖宽度<br>→ 1分米 ≈ 手掌长度<br>→ 1米 ≈ 一步的距离<br><br>⚠️ <b>注意：</b>测量要从0刻度开始，不是从尺的边缘！'},

/* 可爱音效系统：用Web Audio API合成甜美旋律 */
let audioCtx=null;
function initAudio(){
if(!audioCtx){
try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
}
if(audioCtx.state==='suspended'){audioCtx.resume()}
}
/* 首次点击或触摸时初始化音频 */
document.addEventListener('click',initAudio,{once:false});
document.addEventListener('touchstart',initAudio,{once:false});
function getAudio(){if(!audioCtx)initAudio();return audioCtx}
/* 播放单个音符 */
function playNote(freq,start,dur,type='sine',vol=0.3){
const ctx=getAudio();if(!ctx)return;
const osc=ctx.createOscillator();
const gain=ctx.createGain();
osc.type=type;osc.frequency.value=freq;
gain.gain.setValueAtTime(0,ctx.currentTime+start);
gain.gain.linearRampToValueAtTime(vol,ctx.currentTime+start+0.02);
gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur);
osc.connect(gain);gain.connect(ctx.destination);
osc.start(ctx.currentTime+start);osc.stop(ctx.currentTime+start+dur);
}
/* 音效类型 */
function playSound(type){
try{
const ctx=getAudio();if(!ctx)return;
if(ctx.state==='suspended'){
ctx.resume().then(()=>{setTimeout(()=>doPlay(type),50)});
}else{doPlay(type)}
}catch(e){}
}
function doPlay(type){
if(type==='ok'){
/* 打卡成功：叮咚~（两个上升音符，甜美清脆） */
playNote(523,0,0.15,'sine',0.25);  // C5
playNote(784,0.12,0.25,'sine',0.25); // G5
}else if(type==='allDone'){
/* 全部完成：欢快旋律 do mi sol do（叮叮叮叮~） */
playNote(523,0,0.12,'triangle',0.3);   // C5
playNote(659,0.1,0.12,'triangle',0.3); // E5
playNote(784,0.2,0.12,'triangle',0.3); // G5
playNote(1047,0.3,0.3,'triangle',0.3); // C6
}else if(type==='right'){
/* 答对了：叮~叮~（上升两音） */
playNote(659,0,0.1,'sine',0.25);  // E5
playNote(880,0.08,0.2,'sine',0.25); // A5
}else if(type==='wrong'){
/* 答错了：嘟~嘟~（下降两音，温和提示） */
playNote(440,0,0.15,'sine',0.2);   // A4
playNote(330,0.12,0.25,'sine',0.2); // E4
}
}

/* 打卡 */
function ck(key,pts){
if(S.ck[key]){
// 撤回打卡
S.ck[key]=false;S.pts-=pts;
const d=today();if(S.records[d]){S.records[d].cks--;S.records[d].pts-=pts;if(S.records[d].cks<=0)delete S.records[d]}
save();updUI();toast(`已撤回打卡，-${pts}积分`,'no');go(location.hash.replace('#','')||'plan')
}else{
// 打卡
S.ck[key]=true;S.pts+=pts;
const d=today();if(!S.records[d])S.records[d]={cks:0,pts:0};
S.records[d].cks++;S.records[d].pts+=pts;
save();updUI();
/* 检查是否全部完成 */
const allCkDone=Object.values(S.ck).every(Boolean);
const allCustomDone=S.customTasks.every(t=>t.done);
if(allCkDone&&allCustomDone){playSound('allDone')}
else{playSound('ok')}
toast(`打卡成功！+${pts}积分`,'ok');go(location.hash.replace('#','')||'plan')
}
}
function addTask(name,pts){
S.customTasks.push({id:'ct_'+Date.now(),name,pts:pts||1,done:false});
save();go('plan')
}
function delTask(id){
S.customTasks=S.customTasks.filter(t=>t.id!==id);save();go('plan')
}
function ckCustom(id){
const t=S.customTasks.find(x=>x.id===id);if(!t)return;
if(t.done){
// 撤回自定义打卡
t.done=false;S.pts-=t.pts;
const d=today();if(S.records[d]){S.records[d].cks--;S.records[d].pts-=t.pts;if(S.records[d].cks<=0)delete S.records[d]}
save();updUI();toast(`已撤回打卡，-${t.pts}积分`,'no');go('plan')
}else{
// 打卡
t.done=true;S.pts+=t.pts;
const d=today();if(!S.records[d])S.records[d]={cks:0,pts:0};
S.records[d].cks++;S.records[d].pts+=t.pts;
save();updUI();
/* 检查是否全部完成 */
const allCkDone=Object.values(S.ck).every(Boolean);
const allCustomDone=S.customTasks.every(x=>x.done);
if(allCkDone&&allCustomDone){playSound('allDone')}
else{playSound('ok')}
toast(`打卡成功！+${t.pts}积分`,'ok');go('plan')
}
}

/* 宠物动画映射：每种动作对应不同的emoji、动画类名和语音 */
const PET_ANIMS={
feed:{emoji:'🤤',anim:'pet-bounce',speech:'嗷呜~好吃的！再来一点嘛~'},
water:{emoji:'😋',anim:'pet-wiggle',speech:'咕噜咕噜~水真清凉！'},
walk:{emoji:'🏃',anim:'pet-run',speech:'汪汪！出去溜溜真开心！外面的世界好大呀~'},
play:{emoji:'😆',anim:'pet-jump',speech:'耶！玩球球！接住啦~汪汪汪！'},
bath:{emoji:'🛁',anim:'pet-shake',speech:'哗啦啦~洗得真干净！香喷喷的奶牛~'},
sleep:{emoji:'😴',anim:'pet-sleep',speech:'呼噜呼噜~好困呀，让我打个盹儿~zzZ'}
};
function petAction(action){
const p=S.pet;let cost=0;
const animData=PET_ANIMS[action];
switch(action){
case'feed':p.full=Math.min(100,p.full+20);p.hp=Math.min(100,p.hp+5);cost=5;break;
case'water':p.full=Math.min(100,p.full+10);p.hp=Math.min(100,p.hp+5);cost=3;break;
case'walk':p.happy=Math.min(100,p.happy+20);p.hp=Math.min(100,p.hp+5);cost=2;break;
case'play':p.happy=Math.min(100,p.happy+15);cost=3;break;
case'bath':p.clean=Math.min(100,p.clean+30);p.happy=Math.min(100,p.happy+5);cost=6;break;
case'sleep':p.hp=Math.min(100,p.hp+20);p.happy=Math.min(100,p.happy+10);p.full=Math.min(100,p.full+5);cost=1;break;
}
/* 检查积分是否足够 */
if(S.pts<cost){toast('积分不足哦，先去完成打卡任务吧！','no');return}
if(cost>0)S.pts-=cost;
/* 设置宠物动画状态 */
S.petAnim=animData.anim;
S.petSpeech=animData.speech;
S.petAnimEmoji=animData.emoji;
S.petAnimTime=Date.now();
save();updUI();
if(cost>0)toast(`花费${cost}☀积分，${p.name}很开心！`,'ok');
else toast(`${p.name}很开心！`,'ok');
go('pet');
/* 3秒后自动清除动画，恢复原样 */
setTimeout(()=>{
S.petAnim='';S.petSpeech='';S.petAnimEmoji='';
save();go('pet');
},3000)
}

S.pts-=it.p;S.petOwned.push(id);save();updUI();toast(`购买${it.n}成功！`,'ok');go('shop')

/* 英语单词默写系统 */
let engTestData=null;
function engWordTest(unitId){
const u=ENG_UNITS.find(x=>x.id===unitId);
/* 为每个单词生成2道题：1道看中文填英文，1道看英文选中文，共 words.length*2 题 */
let questions=[];
u.words.forEach((w,i)=>{
questions.push({type:'fill',word:w.w,cn:w.cn,idx:i,unitId});
questions.push({type:'choice',word:w.w,cn:w.cn,idx:i,unitId});
});
/* 打乱顺序 */
questions=questions.sort(()=>Math.random()-.5);
engTestData={unitId,unitTitle:u.t,questions,qIdx:0,score:0,total:questions.length,doneWords:new Set()};
showEngTestQ();
}

function showEngTestQ(){
if(!engTestData)return;
const td=engTestData;
if(td.qIdx>=td.questions.length){endEngTest();return}
const q=td.questions[td.qIdx];
const qNum=td.qIdx+1;
const progress=`第 ${qNum} / ${td.total} 题 · 正确：${td.score}`;
const exitBtn=`<div style="text-align:center;margin-top:12px"><button style="font-size:13px;padding:6px 18px;border-radius:14px;background:var(--bg2);color:var(--t2);border:none;cursor:pointer;font-weight:600" onclick="engTestData=null;clM();go('eng')">← 退出默写</button></div>`;

if(q.type==='fill'){
/* 看中文填英文：显示中文，用字母键盘逐个填入 */
const wordLen=q.word.length;
let blanksHtml='';
for(let i=0;i<wordLen;i++){
blanksHtml+=`<span class="fill-cell" id="fc${i}" onclick="engFillSetPos(${i})">_</span> `;
}
document.getElementById('mc').innerHTML=`
<div class="mt">📝 单词默写</div>
<div class="ms">${td.unitTitle} · ${progress}</div>
<div style="text-align:center;margin:10px 0;font-size:14px;color:var(--t2)">请根据中文拼出英文单词</div>
<div style="text-align:center;margin:8px 0;font-size:20px;font-weight:800;color:var(--pink-d)">${q.cn}</div>
<div style="text-align:center;margin:16px 0;letter-spacing:2px">${blanksHtml}</div>
<div class="eng-keyboard" id="engKb"></div>
<div class="mf" style="margin-top:12px"><button class="bse" style="font-size:13px;padding:6px 14px" onclick="engFillClear()">清除</button> <button class="bpr" onclick="engFillSubmit('${q.word}')">确认</button></div>
${exitBtn}`;
/* 生成字母键盘 */
const letters='abcdefghijklmnopqrstuvwxyz'.split('');
document.getElementById('engKb').innerHTML=letters.map(l=>`<button class="kb-key" onclick="engFillInput('${l}')">${l}</button>`).join('');
engTestData.fillPos=0;
engTestData.fillInput=[];
}
else{
/* 看英文选中文：显示英文，给3个中文选项 */
const u=ENG_UNITS.find(x=>x.id===q.unitId);
const others=u.words.filter(w=>w.w!==q.word).sort(()=>Math.random()-.5).slice(0,2);
const opts=[q.cn,...others.map(o=>o.cn)].sort(()=>Math.random()-.5);
document.getElementById('mc').innerHTML=`
<div class="mt">📝 单词默写</div>
<div class="ms">${td.unitTitle} · ${progress}</div>
<div style="text-align:center;margin:10px 0;font-size:14px;color:var(--t2)">请选择正确的中文意思</div>
<div style="text-align:center;margin:8px 0;font-size:20px;font-weight:800;color:var(--pink-d)">${q.word}</div>
<div class="game-opts" id="engOpts">${opts.map(o=>`<button class="game-opt" onclick="engTestChoice('${o}','${q.cn}')">${o}</button>`).join('')}</div>
${exitBtn}`;
}
document.getElementById('mm').classList.add('show');
}

/* 填空输入相关 */
function engFillInput(letter){
const td=engTestData;if(!td)return;
const len=td.questions[td.qIdx].word.length;
if(td.fillPos>=len)return;
const lower=letter.toLowerCase();
td.fillInput[td.fillPos]=lower;
document.getElementById('fc'+td.fillPos).textContent=lower;
document.getElementById('fc'+td.fillPos).classList.add('filled');
td.fillPos++;
/* 自动跳到下一格 */
if(td.fillPos<len){
document.getElementById('fc'+td.fillPos).classList.add('cursor');
}
}
function engFillSetPos(pos){
engTestData.fillPos=pos;
}
function engFillClear(){
const td=engTestData;if(!td)return;
const len=td.questions[td.qIdx].word.length;
td.fillInput=[];td.fillPos=0;
for(let i=0;i<len;i++){
document.getElementById('fc'+i).textContent='_';
document.getElementById('fc'+i).classList.remove('filled');
}
}
function engFillSubmit(correctWord){
const td=engTestData;if(!td)return;
const input=td.fillInput.join('').toLowerCase();
const correct=correctWord.toLowerCase();
const q=td.questions[td.qIdx];
if(input===correct){
engTestData.score++;playSound('right');engWordDone(q.unitId,q.idx);
toast('正确！','ok');
}else{
playSound('wrong');engWordErr(q.word,q.unitId);
toast('正确答案：'+correctWord,'no');
}
engTestData.qIdx++;
setTimeout(()=>{clM();setTimeout(showEngTestQ,800)},800);
}
function engTestChoice(sel,ans){
const ok=sel===ans;
const q=engTestData.questions[engTestData.qIdx];
document.querySelectorAll('#engOpts .game-opt').forEach(b=>{b.classList.add(b.textContent===ans?'ok':'no');b.disabled=true});
if(ok){engTestData.score++;playSound('right');engWordDone(q.unitId,q.idx)}
else{playSound('wrong');engWordErr(q.word,q.unitId)}
engTestData.qIdx++;
setTimeout(()=>{clM();setTimeout(showEngTestQ,600)},600);
}
function endEngTest(){
const td=engTestData;
const total=td.total;
const score=td.score;
const pct=Math.round(score/total*100);
document.getElementById('mc').innerHTML=`
<div class="mt">🎉 默写完成！</div>
<div style="text-align:center;margin:16px 0">
<div style="font-size:36px;font-weight:800;color:var(--pink-d)">${score}/${total}</div>
<div style="font-size:14px;color:var(--t2);margin-top:4px">正确率 ${pct}%</div>
<div style="font-size:14px;margin-top:8px">${pct>=80?'太棒了！':'继续加油！'}</div>
</div>
<div class="mf"><button class="bpr" onclick="engTestData=null;clM();go('eng')">完成</button></div>`;
document.getElementById('mm').classList.add('show');
}

function startGame(type){
gameData={type,score:0,qIdx:0,data:[]};
if(type==='poem'){
gameData.data=POEMS.map(p=>({q:`${p.t} 的作者是？`,opts:[p.a,...POEMS.filter(x=>x.a!==p.a).map(x=>x.a).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5),ans:p.a}));
}else if(type==='math'){
/* 数学思维：一位数乘整十/整百/两位数/三位数，一位数除整十/整百/两位数/三位数 */
const genMathQ=()=>{
const types=['mul10','mul100','mul2','mul3','div10','div100','div2','div3'];
const t=types[Math.floor(Math.random()*types.length)];
const b=Math.floor(Math.random()*9)+2;
let a,ans,q;
if(t==='mul10'){a=(Math.floor(Math.random()*9)+1)*10;ans=a*b;q=a+' × '+b+' = ?'}
else if(t==='mul100'){a=(Math.floor(Math.random()*9)+1)*100;ans=a*b;q=a+' × '+b+' = ?'}
else if(t==='mul2'){a=Math.floor(Math.random()*90)+10;ans=a*b;q=a+' × '+b+' = ?'}
else if(t==='mul3'){a=Math.floor(Math.random()*900)+100;ans=a*b;q=a+' × '+b+' = ?'}
else if(t==='div10'){a=(Math.floor(Math.random()*9)+1)*10*b;ans=a/b;q=a+' ÷ '+b+' = ?'}
else if(t==='div100'){a=(Math.floor(Math.random()*9)+1)*100*b;ans=a/b;q=a+' ÷ '+b+' = ?'}
else if(t==='div2'){a=b*(Math.floor(Math.random()*90)+10);ans=a/b;q=a+' ÷ '+b+' = ?'}
else{a=b*(Math.floor(Math.random()*900)+100);ans=a/b;q=a+' ÷ '+b+' = ?'}
const w1=ans+Math.floor(Math.random()*8)+1;
const w2=Math.max(0,ans-Math.floor(Math.random()*8)-1);
return{q,opts:[ans.toString(),w1.toString(),w2.toString()].sort(()=>Math.random()-.5),ans:ans.toString()};
};
gameData.data=[];
for(let i=0;i<10;i++)gameData.data.push(genMathQ());
}else if(type==='eng'){
const allWords=ENG_UNITS.flatMap(u=>u.words.map(w=>({word:w.w,cn:w.cn})));
gameData.data=allWords.sort(()=>Math.random()-.5).slice(0,8).map(w=>{
const others=allWords.filter(x=>x.cn!==w.cn).sort(()=>Math.random()-.5).slice(0,2);
return{q:`"${w.word}" 的中文意思是？`,opts:[w.cn,...others.map(x=>x.cn)].sort(()=>Math.random()-.5),ans:w.cn,word:w.word};
});
}else if(type==='calc'){
/* 速算冲刺：一位数乘整十/整百/两位/三位，一位数除整十/整百/两位/三位 */
const genCalcQ=()=>{
const types=['mul10','mul100','mul2','mul3','div10','div100','div2','div3'];
const t=types[Math.floor(Math.random()*types.length)];
const b=Math.floor(Math.random()*9)+2;
let a,ans,q;
if(t==='mul10'){a=(Math.floor(Math.random()*9)+1)*10;ans=a*b;q=a+' × '+b+' = ?'}
else if(t==='mul100'){a=(Math.floor(Math.random()*9)+1)*100;ans=a*b;q=a+' × '+b+' = ?'}
else if(t==='mul2'){a=Math.floor(Math.random()*90)+10;ans=a*b;q=a+' × '+b+' = ?'}
else if(t==='mul3'){a=Math.floor(Math.random()*900)+100;ans=a*b;q=a+' × '+b+' = ?'}
else if(t==='div10'){a=(Math.floor(Math.random()*9)+1)*10*b;ans=a/b;q=a+' ÷ '+b+' = ?'}
else if(t==='div100'){a=(Math.floor(Math.random()*9)+1)*100*b;ans=a/b;q=a+' ÷ '+b+' = ?'}
else if(t==='div2'){a=b*(Math.floor(Math.random()*90)+10);ans=a/b;q=a+' ÷ '+b+' = ?'}
else{a=b*(Math.floor(Math.random()*900)+100);ans=a/b;q=a+' ÷ '+b+' = ?'}
const w1=ans+Math.floor(Math.random()*8)+1;
const w2=Math.max(0,ans-Math.floor(Math.random()*8)-1);
return{q,opts:[ans.toString(),w1.toString(),w2.toString()].sort(()=>Math.random()-.5),ans:ans.toString()};
};
gameData.data=[];
for(let i=0;i<10;i++)gameData.data.push(genCalcQ());
}
showGameQ()
}

document.getElementById('mc').innerHTML=`

/* ===== 未完成提醒 ===== */
/* PWA安装提示 */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
function installPrompt(){
if(deferredPrompt){
deferredPrompt.prompt();
deferredPrompt.userChoice.then(ch=>{deferredPrompt=null;if(ch.outcome==='accepted')toast('安装成功！从桌面打开即可使用','ok')});
}else{
toast('请用浏览器菜单 → 添加到主屏幕','ok');
}
}

const REMIND_HOURS=[11,16,20]; // 上午11点、下午4点、晚上8点
const REMIND_KEY='remindedTimes';

/* 获取未完成打卡列表 */
function getUndoneItems(){
const labels={cn_poem:'背诵古诗',cn_read:'阅读30分钟',cn_write:'练字一页',cn_reading:'阅读理解一篇',cn_copy:'摘抄习作例文',
math_calc:'数学计算一页',math_err:'数学错题复习',math_preview:'数学课时预习',
eng_word:'英语单词默写',eng_trace:'单词描红一页',eng_read:'英语朗读',
sport:'跳绳150个'};
const undone=Object.entries(S.ck).filter(([k,v])=>!v&&labels[k]).map(([k])=>labels[k]);
const undoneCustom=S.customTasks.filter(t=>!t.done).map(t=>t.name);
return [...undone,...undoneCustom];
}

/* 发送提醒 */
function sendRemind(hour){
const todayKey=REMIND_KEY+'_'+today()+'_'+hour;
const already=localStorage.getItem(todayKey);
if(already)return; // 今天该时段已提醒过
const undone=getUndoneItems();
if(undone.length===0)return; // 全完成了不需要提醒
localStorage.setItem(todayKey,'1');
const timeLabel=hour===11?'上午':hour===16?'下午':'晚上';
const title=`⏰ ${timeLabel}提醒 · 宠物奶牛学习乐园`;
const body=`你还有 ${undone.length} 项任务未完成：${undone.slice(0,5).join('、')}${undone.length>5?'等...':''}`;

/* 优先使用浏览器通知 */
if('Notification' in window && Notification.permission==='granted'){
try{new Notification(title,{body,icon:'icon-192.png',tag:todayKey})}catch(e){}
}else{
/* 不支持通知时用页面内弹窗提醒 */
showRemindPopup(title,body);
}
}

/* 页面内弹窗提醒（不支持Notification时使用） */
function showRemindPopup(title,body){
let popup=document.getElementById('remind-popup');
if(!popup){
popup=document.createElement('div');
popup.id='remind-popup';
popup.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff;padding:16px 24px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:400px;text-align:center;font-size:14px;font-weight:600;animation:remindSlide .4s ease';
document.body.appendChild(popup);
}
popup.innerHTML=`<div style="font-size:16px;font-weight:800;margin-bottom:6px">${title}</div><div style="font-size:13px;line-height:1.5">${body}</div><div style="margin-top:10px"><button onclick="this.parentElement.parentElement.remove();go('plan')" style="background:#fff;color:var(--pink-d);padding:8px 20px;border-radius:12px;font-weight:700;border:none;cursor:pointer">立即去打卡</button> <button onclick="this.parentElement.parentElement.remove()" style="background:rgba(255,255,255,.3);color:#fff;padding:8px 20px;border-radius:12px;font-weight:600;border:none;cursor:pointer">稍后再说</button></div>`;
/* 15秒后自动消失 */
setTimeout(()=>{if(popup.parentElement)popup.remove()},15000);
}

/* 每分钟检查是否需要提醒 */
function checkRemind(){
const now=new Date();
const h=now.getHours();
const m=now.getMinutes();
/* 在目标小时的第0-2分钟内触发提醒（给一点容错） */
if(m<=2 && REMIND_HOURS.includes(h)){
sendRemind(h);
}
}

/* 请求通知权限 */
function askNotifyPermission(){
if('Notification' in window && Notification.permission==='default'){
Notification.requestPermission();
}
}

/* ===== 启动 ===== */
window.addEventListener('DOMContentLoaded',()=>{
load();
const h=location.hash.replace('#','')||'plan';
go(['plan','cn','math','eng','sport','game','pet','shop'].includes(h)?h:'plan');
/* 启动提醒系统 */
askNotifyPermission();
checkRemind();
setInterval(checkRemind,60000);
/* 注册Service Worker */
if('serviceWorker' in navigator){
navigator.serviceWorker.register('./sw.js?v4').then(reg=>{
/* 检测到新SW立即激活 */
if(reg.waiting)reg.waiting.postMessage('skipWaiting');
reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(nw){nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){nw.postMessage('skipWaiting')}})}});
console.log('SW注册成功 v4');
}).catch(err=>{console.log('SW注册失败:',err)});
}
});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(h)go(h)});
/* SW更新后自动刷新页面 */
navigator.serviceWorker.addEventListener('controllerchange',()=>{location.reload()});
</script>
